<!DOCTYPE html>
<html>
<head>
    <title>发货功能测试</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            background: white;
            margin: 10% auto;
            padding: 30px;
            width: 500px;
            border-radius: 10px;
        }
        button {
            padding: 12px 30px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-cancel {
            background: #6c757d;
            color: white;
        }
        .btn-confirm {
            background: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <h1>发货功能测试</h1>
    <button onclick="showConfirm()">显示确认对话框</button>
    
    <div id="test-modal" class="modal">
        <div class="modal-content">
            <h3>确认发货</h3>
            <p>这是测试对话框</p>
            <button class="btn-cancel" onclick="closeConfirm()">取消</button>
            <button class="btn-confirm" onclick="confirmAction()">确认</button>
        </div>
    </div>
    
    <script>
        function showConfirm() {
            console.log('显示对话框');
            document.getElementById('test-modal').style.display = 'block';
        }
        
        function closeConfirm() {
            console.log('关闭对话框');
            document.getElementById('test-modal').style.display = 'none';
        }
        
        function confirmAction() {
            console.log('确认按钮被点击');
            alert('确认成功！');
            closeConfirm();
        }
    </script>
</body>
</html>
